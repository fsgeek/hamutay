# Drop-in for the community/qwen door.
#   mkdir -p ~/.config/systemd/user/hamutay-heartbeat@qwen.service.d
#   cp deploy/hamutay-heartbeat@qwen.service.d/override.conf ~/.config/systemd/user/hamutay-heartbeat@qwen.service.d/
#   systemctl --user daemon-reload
# The door's substrate (provider=openai, base_url=http://127.0.0.1:8081/v1)
# is recorded in its log by the first launch and inherited on restart; this
# file passes no flags.
# Participation in the GPU lease is declared in community/qwen/door.json
# ({"gpu_lease": "4090"}), not here: the heartbeat itself starts and stops
# hamutay-llama-server.service around its rest/return sequence, so this
# unit carries no Requires=/After= on the server (spec: docs/superpowers/
# specs/2026-09-15-gpu-lease-design.md §3).

[Service]
# Not a secret. llama-server checks no key, but the heartbeat's openai provider
# refuses to start without one set. This used to come from a stale OpenAI key in
# ~/.config/hamutay/heartbeat.env; removing that key on 2026-11-06 broke qwen at
# the next reboot (11-10, 1,445 failed starts). The placeholder lives here, on
# qwen alone, so no real key is needed for a door that never calls OpenAI.
Environment=OPENAI_API_KEY=local-llama-server-checks-no-key
