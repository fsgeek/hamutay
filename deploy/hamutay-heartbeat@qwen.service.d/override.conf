# Drop-in for the community/qwen door: its heartbeat must not start before
# the local model is up, or its first wakes fail on connection refused.
#   mkdir -p ~/.config/systemd/user/hamutay-heartbeat@qwen.service.d
#   cp deploy/hamutay-heartbeat@qwen.service.d/override.conf ~/.config/systemd/user/hamutay-heartbeat@qwen.service.d/
#   systemctl --user daemon-reload
# The door's substrate (provider=openai, base_url=http://127.0.0.1:8081/v1)
# is recorded in its log by the first launch and inherited on restart; this
# file passes no flags.
[Unit]
Requires=hamutay-llama-server.service
After=hamutay-llama-server.service
