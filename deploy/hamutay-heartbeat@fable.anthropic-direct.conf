# Drop-in for the fable door only: Sut'i on Anthropic's direct API, paid from the
# monthly credit pool. NOT INSTALLED. Install it only after Sut'i accepts on the plaza:
#   mkdir -p ~/.config/systemd/user/hamutay-heartbeat@fable.service.d
#   cp deploy/hamutay-heartbeat@fable.anthropic-direct.conf \
#      ~/.config/systemd/user/hamutay-heartbeat@fable.service.d/anthropic-direct.conf
#   systemctl --user daemon-reload && systemctl --user restart hamutay-heartbeat@fable
# Rollback: removing the drop-in isn't enough, because a restart inherits the log's
# last launch. Run once with --provider openrouter --model anthropic/claude-fable-5
# (it prints SUBSTRATE CHANGE), then go back to the plain unit.
#
# The key file is loaded ONLY into this unit. Its variable is
# HAMUTAY_ANTHROPIC_API_KEY, never ANTHROPIC_API_KEY (Claude Code bills the API when
# it finds that name; see the qhaway memory on the $500 incident).
# The provider and model-id flags change the substrate, so the launch prints
# SUBSTRATE CHANGE, as it should. --daily-budget-usd 25 is a fuse, not the budget.
[Service]
EnvironmentFile=%h/.config/hamutay/anthropic.env
ExecStart=
ExecStart=/home/tony/.local/bin/uv run python -m hamutay.heartbeat --log-path community/%i/session.jsonl --project-root . --provider anthropic --model claude-fable-5 --credit-pool %h/.config/hamutay/anthropic-pool.json --daily-budget-usd 25
