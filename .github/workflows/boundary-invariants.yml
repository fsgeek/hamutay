name: boundary-invariants

# Produces the required status check of the same name on refs/heads/main.
#
# The branch rule requiring this check was configured before any workflow
# existed to report it, which left main unpushable by anyone. That ordering is
# itself the lesson: a gate without a check blocks all work, while a check
# without a gate is merely advisory and can be tightened afterward. Add the
# check first, then require it.
#
# This deliberately runs the FULL suite rather than only tests/red_bar/. The
# boundary red bars are dormant xfails today; a job that ran only those would
# report green while testing nothing, which is precisely the failure mode of an
# instrument whose summary is true and uninformative.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  boundary-invariants:
    name: boundary-invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Full test suite
        run: uv run pytest -q

      # Reported separately so a strict-xfail flip is legible in the log rather
      # than buried in the suite total. When a boundary invariant becomes
      # implementable, its xfail turns into an xpass, strict=True turns that
      # into a failure, and this step names which guard woke up.
      - name: Boundary red bars (strict xfail — an xpass here is a real failure)
        run: uv run pytest tests/red_bar/ -v --no-header
